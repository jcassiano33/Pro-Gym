{% load static %}<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pro Gym | {% block title %}Autenticação{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'progym/img/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'progym/vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'progym/css/styles.css' %}">
  <script defer src="{% static 'progym/vendor/bootstrap.bundle.min.js' %}"></script>
  <script defer src="{% static 'progym/js/progym.js' %}"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="d-flex justify-content-end gap-3 p-4">
    {% block topbar %}
      <a href="{% url 'cadastro' %}" class="btn pg-btn rounded-pill px-3">Cadastrar-se</a>
    {% endblock %}
  </header>

  <div class="flex-grow-1 d-flex align-items-center pb-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-10 col-lg-9">
          <main class="pg-auth-card">
            <div class="row g-0">
              <section class="col-md-7 p-4 p-lg-5">
                {% for message in messages %}
                  <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                  </div>
                {% endfor %}
                <h1 class="fw-light mb-4">{% block heading %}Login{% endblock %}</h1>
                {% block content %}{% endblock %}
              </section>
              <aside class="col-md-5 d-none d-md-flex pg-auth-logo" aria-hidden="true">
                <img src="{% static 'progym/img/logo_progym.png' %}" alt="">
              </aside>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
